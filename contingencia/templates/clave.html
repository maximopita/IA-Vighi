{% extends "base.html" %}
{% block titulo %}Cambiar clave{% endblock %}
{% block contenido %}
<div class="tarjeta login">
  <h1>Cambiar clave</h1>
  {% if yo.debe_cambiar_clave %}<p class="aviso">Antes de seguir, elegí una clave propia.</p>{% endif %}
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf }}">
    <label>Clave actual</label><input name="actual" type="password" required autocomplete="current-password">
    <label style="margin-top:10px">Nueva clave (mínimo 8 caracteres)</label><input name="nueva" type="password" required autocomplete="new-password">
    <label style="margin-top:10px">Repetir nueva clave</label><input name="nueva2" type="password" required autocomplete="new-password">
    <div class="acciones"><button class="btn">Guardar</button></div>
  </form>
</div>
{% endblock %}
